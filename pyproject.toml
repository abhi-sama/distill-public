[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "distill"
version = "0.1.0"
description = "Build calibrated local decision models from teacher-labelled synthetic data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "datasketch>=1.6",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "python-multipart>=0.0.18",
    "PyYAML>=6.0",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
distill = "distill.cli:app"

[project.optional-dependencies]
cleanlab = [
    "cleanlab>=2.8",
]

[dependency-groups]
dev = [
    "cleanlab>=2.8",
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# The formatter intentionally preserves long structured schemas and report strings.
ignore = ["E501"]
